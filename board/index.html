<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수능 현황판</title>
<meta name="description" content="2027학년도 수능 D-day, 시험 시간표·준비물·주요 일정, 시험 후 수험생 혜택, 작년 공식 등급컷까지 수험생을 위한 수능 현황판.">
<script>try{var t=localStorage.getItem("exam-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="board.css?v=6904f738">
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#">
      <span>수능 현황판</span>
    </a>
    <div class="top-meta mono">
      <span class="sys"><span class="dot" aria-hidden="true"></span><span id="stamp">LOADING</span></span>
      <span class="clock" id="clock" aria-label="현재 시각"></span>
      <button class="theme-btn" id="theme" type="button"></button>
    </div>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="시험 분야"></nav>
  <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>
</header>

<main class="wrap">
  <!-- 홈: 처음 온 사람용 요약 -->
  <div id="view-home" class="view">
    <section class="row r1" aria-label="주요 현황">
      <article class="panel countdown" id="countdown"></article>
      <article class="panel radial" id="radial"></article>
      <article class="panel spotlight" id="spotlight" aria-live="polite"></article>
    </section>

    <section aria-labelledby="cats-h" class="block">
      <div class="block-head"><h2 id="cats-h"><span class="mono tag">browse</span>분야별로 보기</h2></div>
      <div class="cats" id="cats"></div>
    </section>

    <section class="row r2" aria-label="변화량과 일정">
      <article class="panel diverge" id="diverge"></article>
      <article class="panel sched-panel">
        <div class="p-head"><span class="tag">schedule</span><span class="p-sub mono">data/schedule.json</span></div>
        <h3 class="p-title">다음 시험 일정</h3>
        <div class="sched" id="sched"></div>
      </article>
    </section>
  </div>

  <!-- 분야 화면: 수험생용 상세까지 -->
  <div id="view-cat" class="view" hidden>
    <section class="cat-head" id="cat-head"></section>
    <article class="panel guide" id="guide" hidden></article>
    <article class="panel cycler" id="cycler" hidden></article>
    <section class="block" aria-labelledby="cat-grid-h">
      <div class="block-head">
        <h2 id="cat-grid-h"><span class="mono tag">results</span>전년 대비</h2>
        <div class="legend"><span><i class="lg now"></i>최근 연도</span><span><i class="lg prev"></i>이전 연도</span><span>비율 차이 %p · 점수 차이 점 · 인원 차이 명</span></div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </div>

  <section class="block detail" id="detail" aria-live="polite"></section>
  <section class="block issue" id="issue"></section>
</main>

<footer class="wrap foot" id="foot"></footer>
<script src="api.js?v=6904f738"></script>
<script src="board.js?v=6904f738"></script>
</body>
</html>
